<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1400" width="1000" height="1400" role="img" aria-labelledby="t d">
  <title id="t">Composition sketch: Finished Card (not a contest asset)</title>
  <desc id="d">Grey wireframe showing border, headline, portrait, chest digits, room and props zones on a 5:7 card. Placement only.</desc>
  <style>
    .bg{fill:#f4f2ee}.box{fill:#e3e0da;stroke:#8a857c;stroke-width:3}.zone{fill:#d3cfc7;stroke:#5e5a53;stroke-width:3;stroke-dasharray:12 8}
    .lbl{font:600 28px ui-monospace,Menlo,monospace;fill:#3b3832}.sm{font:500 21px ui-monospace,Menlo,monospace;fill:#55514a}
    .big{font:700 64px ui-monospace,Menlo,monospace;fill:#8a857c}.ban{fill:#3b3832}.bt{font:700 26px ui-monospace,Menlo,monospace;fill:#f4f2ee;letter-spacing:2px}
    .frame{fill:none;stroke:#8a857c;stroke-width:60}
  </style>
  <rect class="bg" width="1000" height="1400"/>
  <rect class="frame" x="30" y="30" width="940" height="1340"/>
  <rect class="box" x="60" y="60" width="880" height="1280"/>
  <rect class="zone" x="160" y="120" width="680" height="150"/>
  <text class="lbl" x="500" y="190" text-anchor="middle">HEADLINE · "Peace on Earth"</text>
  <text class="sm" x="500" y="235" text-anchor="middle">small line · "and a successful upload."</text>
  <rect class="zone" x="90" y="320" width="230" height="500"/>
  <text class="sm" x="205" y="560" text-anchor="middle">ROOM · tree</text>
  <text class="sm" x="205" y="590" text-anchor="middle">(C02)</text>
  <rect class="zone" x="690" y="320" width="220" height="260"/>
  <text class="sm" x="800" y="450" text-anchor="middle">window (C02)</text>
  <circle class="zone" cx="500" cy="470" r="120"/>
  <text class="lbl" x="500" y="465" text-anchor="middle">PANDA SELF</text>
  <text class="sm" x="500" y="500" text-anchor="middle">face (C01)</text>
  <path class="box" d="M300 640 L700 640 L780 1100 L220 1100 Z"/>
  <rect class="zone" x="390" y="690" width="220" height="110"/>
  <text class="big" x="500" y="770" text-anchor="middle">11:59</text>
  <text class="sm" x="500" y="835" text-anchor="middle">TIER 1 · type overlay</text>
  <rect x="400" y="855" width="200" height="22" fill="#b2ada4"/>
  <text class="sm" x="500" y="915" text-anchor="middle">TIER 2 · bar (C03)</text>
  <text class="sm" x="500" y="1060" text-anchor="middle">SWEATER ON BODY (C03)</text>
  <rect class="zone" x="90" y="1130" width="245" height="150"/>
  <text class="sm" x="212" y="1210" text-anchor="middle">laptop+bow (C06)</text>
  <rect class="zone" x="740" y="1130" width="170" height="150"/>
  <text class="sm" x="825" y="1210" text-anchor="middle">cocoa (C06)</text>
  <text class="sm" x="500" y="1230" text-anchor="middle">BORDER 90 px (C05)</text>
  <text class="sm" x="500" y="1260" text-anchor="middle">1500 x 2100 px · 5 x 7 in</text>
  <rect class="ban" x="0" y="0" width="1000" height="60"/>
  <text class="bt" x="500" y="40" text-anchor="middle">COMPOSITION SKETCH — NOT A CONTEST ASSET</text>
  <rect class="ban" x="0" y="1340" width="1000" height="60"/>
  <text class="bt" x="500" y="1380" text-anchor="middle">COMPOSITION SKETCH — NOT A CONTEST ASSET</text>
<path d="M590 800 Q620 775 620 805 Q620 835 640 820 M600 780 L640 840" fill="none" stroke="#55514a" stroke-width="5"/>
  <text class="sm" x="500" y="1190" text-anchor="middle">Same loose stitch; quiet room, sincere portrait</text>
</svg>
